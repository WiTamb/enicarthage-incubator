<aside class="sidebar glass-card">
  <div class="brand">
    <h3>Incubator</h3>
  </div>
  
  <nav class="nav-menu">
    <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
      <span class="icon">📊</span> Dashboard
    </a>
    <a routerLink="/projects" routerLinkActive="active" class="nav-item">
      <span class="icon">🚀</span> {{ user?.role === 'STUDENT' ? 'Mes Projets' : 'Tous les Projets' }}
    </a>
    <a routerLink="/events" routerLinkActive="active" class="nav-item">
      <span class="icon">📅</span> Événements
    </a>
  </nav>

  <div class="user-info" *ngIf="user">
    <div class="avatar">{{ user?.firstName?.charAt(0) || 'U' }}</div>
    <div class="details">
      <span class="name">{{ user?.firstName }} {{ user?.lastName }}</span>
      <span class="role">{{ user?.role }}</span>
    </div>
    <button class="logout-btn" (click)="logout()" title="Déconnexion">🚪</button>
  </div>
</aside>
