<div class="submit-container dashboard-layout">
  <!-- Sidebar Component -->
  <app-sidebar></app-sidebar>

  <!-- Main Content -->
  <main class="main-content">
    <header class="top-bar glass-card">
      <h2>Soumettre une idée de Projet</h2>
      <button class="btn-secondary" routerLink="/dashboard">Retour</button>
    </header>

    <div class="form-card glass-card">
      <form (ngSubmit)="onSubmit()" #projectForm="ngForm">
        <div class="input-group">
          <label for="title">Titre du Projet *</label>
          <input type="text" id="title" name="title" [(ngModel)]="project.title" required placeholder="Nom innovant de votre idée">
        </div>

        <div class="input-group">
          <label for="programId">Programme d'incubation *</label>
          <select id="programId" name="programId" [(ngModel)]="project.programId" required class="form-select">
            <option *ngFor="let prog of programs" [value]="prog.id">{{ prog.name }}</option>
          </select>
        </div>

        <div class="input-group">
          <label for="description">Description détaillée *</label>
          <textarea id="description" name="description" rows="5" [(ngModel)]="project.description" required placeholder="Décrivez le problème que vous résolvez et votre solution..."></textarea>
        </div>

        <div class="input-row">
          <div class="input-group">
            <label for="document">Document (PDF/Word)</label>
            <input type="file" id="document" (change)="onFileChange($event, 'document')" accept=".pdf,.doc,.docx">
          </div>
          
          <div class="input-group">
            <label for="image">Image (Logo/Aperçu)</label>
            <input type="file" id="image" (change)="onFileChange($event, 'image')" accept="image/png, image/jpeg">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary" [disabled]="!projectForm.form.valid || isSubmitting">
            {{ isSubmitting ? 'Soumission...' : 'Envoyer mon Projet' }}
          </button>
        </div>
      </form>
    </div>
  </main>
</div>
